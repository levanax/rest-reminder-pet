<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene mock</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #3a4550; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="snow"></canvas>
    <script type="module">
      import { startBlinds } from "/src/snow/BlindsRenderer.ts";
      import { startRainGlass } from "/src/snow/RainGlassRenderer.ts";
      import { startRainStreak } from "/src/snow/RainStreakRenderer.ts";
      import { startSnow } from "/src/snow/SnowRenderer.ts";

      const params = new URLSearchParams(location.search);
      const scene = params.get("scene") || "snow";
      const canvas = document.getElementById("snow");
      if (scene === "rainGlass") {
        startRainGlass(canvas);
        window.__scene = "rainGlass";
      } else if (scene === "rainStreak") {
        startRainStreak(canvas);
        window.__scene = "rainStreak";
      } else if (scene === "blinds") {
        startBlinds(canvas);
        window.__scene = "blinds";
      } else {
        startSnow({
          active: true,
          scene: "snow",
          window: { width: window.innerWidth, height: window.innerHeight },
          monitors: [{ x: 0, y: 0, width: window.innerWidth, height: window.innerHeight }],
        });
        window.__scene = "snow";
      }
    </script>
  </body>
</html>
