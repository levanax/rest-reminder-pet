[package]
name = "rest-reminder-pet"
version = "0.1.0"
description = "Rest Reminder Pet — desktop break reminder with a cute pet"
authors = ["levana"]
edition = "2021"
default-run = "rest-reminder-pet"

[lib]
name = "rest_reminder_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rest-reminder-pet"
path = "src/main.rs"

[[bin]]
name = "rest-reminder-gen"
path = "src/bin/rest_reminder_gen.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rdev = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
fs_extra = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
